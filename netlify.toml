# Netlify leser denne filen ved hver publisering fra GitHub.
# bygg.py lager dist/ uten guiden og kommentarene, og det er bare dist/ som
# blir publisert. Kildefilene med guiden, LES-MEG.md og bygg.py blir ikke
# synlige på nettsiden. Feiler byggingen, blir forrige versjon liggende ute.
[build]
  command = "python3 bygg.py"
  publish = "dist"

# Kundeportalen (dotdev.no/kunde): serverfunksjonen som sjekker innloggingen og
# henter tallene fra Plausible. Nøklene ligger som miljøvariabler i Netlify,
# aldri her (repoet er offentlig). Se «Kundeportalen» i LES-MEG.md.
[functions]
  directory = "netlify/functions"

# Besøksstatistikk (Plausible) via eget domene: skriptet og hendelsene går gjennom
# dotdev.no, så CSP i _headers kan stå som 'self', og færre besøk blokkeres.
# Unngå ord som «analytics», «stats» og «plausible» i stiene (blokkeres av adblock).
[[redirects]]
  from = "/dd/js/s.js"
  to = "https://plausible.io/js/pa-BtOpdQu0BlUGAnXgx6ko4.js"
  status = 200
  force = true

[[redirects]]
  from = "/dd/api/e"
  to = "https://plausible.io/api/event"
  status = 200
  force = true

# Én adresse per side: .html-adressene sendes videre (301) til de korte, så samme side
# ikke finnes på to adresser. Spørrestrengen (f.eks. ?lang=en) følger med. Lenk alltid
# til de korte adressene (/, /personvern, /kunde). force = true trengs, fordi filene finnes.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/personvern.html"
  to = "/personvern"
  status = 301
  force = true

[[redirects]]
  from = "/kunde.html"
  to = "/kunde"
  status = 301
  force = true
